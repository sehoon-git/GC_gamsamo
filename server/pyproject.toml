[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gc-seoyun"
version = "0.4.0"
description = "Seoyun local counseling dialogue experiment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn==0.54.0",
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "langgraph==1.2.20",
  "transformers==5.20.2",
]

[project.optional-dependencies]
serve = ["vllm==0.33.0", "torch==2.14.0"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
